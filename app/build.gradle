plugins {
    id 'com.android.application'
}

android {
    namespace 'com.assistive.touch'
    compileSdk 35

    defaultConfig {
        applicationId 'com.assistive.touch'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK is installable as-is.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries – uses only the Android framework.
